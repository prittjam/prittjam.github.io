<!DOCTYPE html>
<html lang="{{ site.lang | default: 'en' }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page.title | default: site.title }}</title>
    <meta name="description" content="{{ page.description | default: site.description }}">

    <link rel="canonical" href="{{ page.url | absolute_url }}">

    <!-- Open Graph: how a pasted link renders on LinkedIn, Bluesky, Mastodon,
         Slack, WhatsApp, Signal, Discord and iMessage. Absolute URLs are
         required here — crawlers do not resolve relative paths. -->
    <meta property="og:type" content="profile">
    <meta property="og:site_name" content="{{ site.title }}">
    <meta property="og:title" content="{{ page.title | default: site.title }}">
    <meta property="og:description" content="{{ page.description | default: site.description | strip_newlines | escape }}">
    <meta property="og:url" content="{{ page.url | absolute_url }}">
    <meta property="og:locale" content="en_US">
    <meta property="og:image" content="{{ '/img/og-card.png' | absolute_url }}">
    <meta property="og:image:type" content="image/png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:alt" content="{{ site.data.profile.name }} — CAU Kiel, Marie Skłodowska-Curie Fellow. Robust geometric estimation for computer vision.">
    <meta property="profile:first_name" content="James">
    <meta property="profile:last_name" content="Pritts">
    <meta property="profile:username" content="prittjam">

    <!-- X only needs the tags that have no Open Graph equivalent; title,
         description and image fall back to the og:* tags above. -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:creator" content="@prittjam">

    <!-- Favicon (shown next to Google search results) -->
    <link rel="icon" href="{{ '/favicon.ico' | relative_url }}" sizes="any">
    <link rel="icon" type="image/png" sizes="48x48" href="{{ '/favicon-48x48.png' | relative_url }}">
    <link rel="icon" type="image/png" sizes="96x96" href="{{ '/favicon-96x96.png' | relative_url }}">
    <link rel="icon" type="image/png" sizes="192x192" href="{{ '/favicon-192x192.png' | relative_url }}">
    <link rel="apple-touch-icon" sizes="180x180" href="{{ '/apple-touch-icon.png' | relative_url }}">

    <link rel="stylesheet" href="./css/style.css">

    <!-- schema.org/Person: helps Google associate your name, photo, and affiliations -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Person",
      "name": {{ site.data.profile.name | jsonify }},
      "url": {{ site.url | jsonify }},
      "image": {{ site.url | append: '/me.png' | jsonify }},
      "jobTitle": "Marie Skłodowska-Curie Fellow",
      "worksFor": {
        "@type": "CollegeOrUniversity",
        "name": "Kiel University (CAU Kiel)"
      },
      {%- capture hrefs -%}
      {%- for s in site.data.social -%}
      {%- unless s.key == "email" or s.key == "cv" -%}{{ s.href }}|{%- endunless -%}
      {%- endfor -%}
      {%- endcapture -%}
      "sameAs": {{ hrefs | split: "|" | jsonify }}
    }
    </script>
  </head>

  <body>
    <nav>
      <div class="nav-inner">
        <a href="#about">About</a>
        <a href="#news">News</a>
        <a href="#publications">Publications</a>
        <a href="#awards">Awards</a>
        <a href="#advising">Advising</a>
        <a href="#teaching">Teaching</a>
      </div>
    </nav>

    <div class="wrap">
{{ content }}
      <footer>
        &copy; {{ site.time | date: '%Y' }} {{ site.data.profile.name }}
      </footer>
    </div>

    <!-- ============ AWARD LIGHTBOXES (pure CSS :target) ============ -->
    {%- for a in site.data.awards %}
    <a href="#" class="lightbox" id="{{ a.lightbox }}">
      <span class="close">&times;</span>
      <img src="{{ a.image }}" alt="{{ a.alt }}" width="{{ a.width }}" height="{{ a.height }}" loading="lazy">
    </a>
    {%- endfor %}
  </body>
</html>
